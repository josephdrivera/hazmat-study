<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 170" role="img" aria-label="Cargo tank trailer, side view">
  <g stroke="#1c2430" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- single manhole inside a flashing box with rollover protection -->
    <path d="M204 30l6-10h40l6 10z" fill="#b8c0cc"/>
    <rect x="200" y="30" width="60" height="12" fill="#b8c0cc"/>
    <path d="M216 30a14 7 0 0 1 28 0z" fill="#d9dee5"/>
    <!-- round / horseshoe cross-section body -->
    <rect x="16" y="40" width="288" height="78" rx="39" fill="#e9edf2"/>
    <!-- smooth insulated jacket seam -->
    <line x1="36" y1="60" x2="284" y2="60" stroke-dasharray="4 6"/>
    <!-- rear outlet -->
    <rect x="236" y="118" width="14" height="10" fill="#9aa3b0"/>
    <!-- chassis, landing gear, wheels -->
    <line x1="40" y1="128" x2="300" y2="128"/>
    <rect x="48" y="128" width="6" height="18" fill="#9aa3b0"/>
    <circle cx="232" cy="146" r="16" fill="#3a4250"/>
    <circle cx="232" cy="146" r="6" fill="#d9dee5"/>
    <circle cx="272" cy="146" r="16" fill="#3a4250"/>
    <circle cx="272" cy="146" r="6" fill="#d9dee5"/>
  </g>
</svg>
